syntax = "proto3";
package FL.v1;
option go_package = "github.com/mawi118/family_ledger_BACK/proto";

message User {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
}

message LoginRequest{
  string email = 1;
  string password = 2;
}
message LoginResponse{
  string token = 1;
  User user = 2;
}

message RegisterRequest  {
  string email = 1;
  string password = 2;
  string first_name = 3;
}
message RegisterResponse {
  string token = 1;
  User user = 2;
}

message EmailExistsRequest {
  string email = 1;
}
message EmailExistsResponse {
  bool exists = 1 ;
}

service Auth {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc EmailExists (EmailExistsRequest) returns (EmailExistsResponse);
}