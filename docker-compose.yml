services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family_ledger
      POSTGRES_PASSWORD: family_ledger
      POSTGRES_DB: family_ledger_full
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_ledger -d family_ledger_full"]
      interval: 2s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/prod:/migrations
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://family_ledger:family_ledger@postgres:5432/family_ledger_full?sslmode=disable"
      - "up"
    restart: "no"

  backend:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5050:5050"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
    restart: unless-stopped

volumes:
  pgdata: