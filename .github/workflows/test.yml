name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: family_ledger
          POSTGRES_PASSWORD: family_ledger
          POSTGRES_DB: family_ledger_full
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family_ledger -d family_ledger_full"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate

      - name: Run migrations
        run: |
          migrate -database "postgres://family_ledger:family_ledger@localhost:5432/family_ledger_full?sslmode=disable" \
            -path migrations/prod up

      - name: Run tests
        env:
          TEST_DATABASE_URL: "postgres://family_ledger:family_ledger@localhost:5432/family_ledger_full?sslmode=disable"
        run: go test ./... -v -p 1